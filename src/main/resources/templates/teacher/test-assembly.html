<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="auto">
<head th:replace="fragments/header :: head"></head>
<body>
    <div th:replace="fragments/header :: header-content"></div>
    <div th:replace="fragments/sidebar :: sidebar-content"></div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-shuffle me-2"></i>
                        Rule-Based Test Assembly: <span th:text="${paper.title}">Paper</span>
                    </h5>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-4">
                        Define rules for automatic question selection. The system will randomly select
                        questions matching your criteria from the question bank.
                        <br><strong>Bonus Feature:</strong> Difficulty-proportional test assembly.
                    </p>

                    <div id="rulesContainer">
                        <!-- Rule rows will be added here -->
                    </div>

                    <div class="mt-3 d-flex gap-2">
                        <button type="button" class="btn btn-outline-primary" onclick="addRule()">
                            <i class="bi bi-plus-circle me-1"></i>Add Rule
                        </button>
                        <button type="button" class="btn btn-success" onclick="executeAssembly()">
                            <i class="bi bi-play-fill me-1"></i>Execute Assembly
                        </button>
                        <div class="spinner-border text-primary ms-2 d-none" id="loadingSpinner" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>

                    <div id="resultArea" class="mt-4 d-none">
                        <div class="alert" id="resultAlert">
                            <h6><i class="bi bi-info-circle me-2"></i>Assembly Results</h6>
                            <p id="resultMessage" class="mb-0"></p>
                            <ul id="warningsList" class="mb-0 mt-2"></ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <a th:href="@{/teacher/papers/questions/{id}(id=${paper.id})}" class="btn btn-primary">
                    <i class="bi bi-list-ul me-2"></i>View Paper Questions
                </a>
                <a th:href="@{/teacher/papers}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-2"></i>Back to Papers
                </a>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer-content"></div>

    <span id="_paperId" style="display:none" th:text="${paper.id}">0</span>

    <script>
        var ruleCount = 0;
        var paperId = parseInt(document.getElementById('_paperId').textContent) || 0;

        function createRuleRow() {
            ruleCount++;
            var div = document.createElement('div');
            div.className = 'rule-row row g-2 mb-3 p-3 border rounded bg-opacity-10';
            div.id = 'rule' + ruleCount;
            div.innerHTML = `
                <div class="col-md-3">
                    <label class="form-label small">Question Type</label>
                    <select class="form-select form-select-sm rule-type">
                        <option value="SINGLE_CHOICE">Single Choice</option>
                        <option value="MULTIPLE_CHOICE">Multiple Choice</option>
                        <option value="TRUE_FALSE">True/False</option>
                        <option value="FILL_BLANK">Fill Blank</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Difficulty</label>
                    <select class="form-select form-select-sm rule-difficulty">
                        <option value="EASY">Easy</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HARD">Hard</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Count</label>
                    <input type="number" class="form-control form-control-sm rule-count" value="5" min="1" max="50">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Score Each</label>
                    <input type="number" class="form-control form-control-sm rule-score" value="5" min="1" step="0.5">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRule('rule${ruleCount}')">
                        <i class="bi bi-trash"></i> Remove
                    </button>
                </div>`;
            return div;
        }

        function addRule() {
            document.getElementById('rulesContainer').appendChild(createRuleRow());
        }

        function removeRule(id) {
            var el = document.getElementById(id);
            if (el) el.remove();
        }

        function executeAssembly() {
            var rules = [];
            var rows = document.querySelectorAll('.rule-row');
            rows.forEach(function(row) {
                rules.push({
                    type: row.querySelector('.rule-type').value,
                    difficulty: row.querySelector('.rule-difficulty').value,
                    count: parseInt(row.querySelector('.rule-count').value),
                    score: parseFloat(row.querySelector('.rule-score').value)
                });
            });

            if (rules.length === 0) {
                alert('Please add at least one assembly rule.');
                return;
            }

            document.getElementById('loadingSpinner').classList.remove('d-none');

            fetch('/exam/teacher/papers/assemble/' + paperId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(rules)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loadingSpinner').classList.add('d-none');
                var resultArea = document.getElementById('resultArea');
                var resultAlert = document.getElementById('resultAlert');

                resultArea.classList.remove('d-none');
                resultAlert.className = data.warnings && data.warnings.length > 0 ? 'alert alert-warning' : 'alert alert-success';

                document.getElementById('resultMessage').textContent =
                    'Added ' + data.totalAdded + ' questions. Total score: ' + data.totalScore;

                var warningsList = document.getElementById('warningsList');
                warningsList.innerHTML = '';
                if (data.warnings && data.warnings.length > 0) {
                    data.warnings.forEach(function(w) {
                        var li = document.createElement('li');
                        li.textContent = w;
                        warningsList.appendChild(li);
                    });
                }
            })
            .catch(err => {
                document.getElementById('loadingSpinner').classList.add('d-none');
                alert('Error: ' + err.message);
            });
        }

        // Start with a default rule
        addRule();
    </script>
</body>
</html>
