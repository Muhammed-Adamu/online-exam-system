<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="auto">
<head th:replace="fragments/header :: head"></head>
<body>
    <div th:replace="fragments/header :: header-content"></div>
    <div th:replace="fragments/sidebar :: sidebar-content"></div>

    <!-- Score Summary -->
    <div class="card mb-4 result-summary">
        <div class="card-body text-center py-4">
            <h2 class="mb-2" th:text="${paper.title}">Exam Title</h2>
            <p class="text-muted" th:text="${record.status == 'GRADED' ? 'Graded' : 'Submitted'}">Status</p>
            <div class="score-circle mx-auto my-3"
                 th:classappend="${record.totalScore != null && record.totalScore >= paper.totalScore * 0.6} ? 'score-pass' : 'score-fail'">
                <span class="score-value" th:text="${record.totalScore != null ? record.totalScore : 'N/A'}">0</span>
                <span class="score-divider">/</span>
                <span class="score-total" th:text="${paper.totalScore}">100</span>
            </div>
            <div class="d-flex justify-content-center gap-4 text-muted">
                <span><i class="bi bi-clock me-1"></i>
                    <span th:text="${record.timeSpentSeconds != null ? (record.timeSpentSeconds / 60) + ' min' : 'N/A'}">Time</span>
                </span>
                <span><i class="bi bi-calendar me-1"></i>
                    <span th:text="${record.submitTime}">Date</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Answer Details -->
    <div class="card">
        <div class="card-header">
            <h5 class="card-title mb-0"><i class="bi bi-list-check me-2"></i>Answer Details</h5>
        </div>
        <div class="card-body p-0">
            <div th:each="ar, iter : ${answers}" class="answer-detail p-3 border-bottom">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div class="d-flex gap-2 align-items-center">
                        <span class="badge bg-secondary" th:text="'Q' + ${iter.count}">Q1</span>
                        <span class="badge bg-primary" th:text="${ar.question?.questionType}">TYPE</span>
                        <span class="badge" th:classappend="${ar.question?.difficulty == 'EASY'} ? 'bg-success' : (${ar.question?.difficulty == 'MEDIUM'} ? 'bg-warning' : 'bg-danger')"
                              th:text="${ar.question?.difficulty}">DIFF</span>
                    </div>
                    <div class="d-flex gap-2 align-items-center">
                        <span th:if="${ar.scoreEarned != null}" class="badge fs-6"
                              th:classappend="${ar.isCorrect == 1} ? 'bg-success' : 'bg-danger'"
                              th:text="${ar.scoreEarned + ' pts'}">score</span>
                        <i th:if="${ar.isCorrect == 1}" class="bi bi-check-circle-fill text-success fs-5"></i>
                        <i th:if="${ar.isCorrect == 0}" class="bi bi-x-circle-fill text-danger fs-5"></i>
                    </div>
                </div>

                <p class="mb-2" th:text="${ar.question?.content}">Question</p>

                <!-- Options display -->
                <div th:if="${ar.question?.questionType != 'FILL_BLANK'}">
                    <div th:each="opt : ${ar.question?.getOptions()}" class="small mb-1"
                         th:classappend="${opt.key.equalsIgnoreCase(ar.question?.correctAnswer)} ? 'text-success fw-bold' : ''">
                        <span th:text="${opt.key + '. ' + opt.value}">Option</span>
                        <i th:if="${opt.key.equalsIgnoreCase(ar.question?.correctAnswer)}" class="bi bi-check-lg text-success"></i>
                    </div>
                </div>

                <div class="mt-2 p-2 rounded" th:classappend="${ar.isCorrect == 1} ? 'bg-success-subtle' : 'bg-danger-subtle'">
                    <small><strong>Your Answer:</strong> <span th:text="${ar.studentAnswer} ?: '(no answer)'">answer</span></small><br>
                    <small class="text-success"><strong>Correct Answer:</strong> <span th:text="${ar.question?.correctAnswer}">correct</span></small>
                </div>

                <div th:if="${ar.question?.explanation != null}" class="mt-2 p-2 bg-info-subtle rounded">
                    <small><strong>Explanation:</strong> <span th:text="${ar.question?.explanation}">explanation</span></small>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a th:href="@{/student/exams}" class="btn btn-primary">
            <i class="bi bi-arrow-left me-2"></i>Back to Exams
        </a>
        <a th:href="@{/student/scores}" class="btn btn-outline-primary">
            <i class="bi bi-trophy me-2"></i>My Scores
        </a>
        <a th:href="@{/student/wrong-answers}" class="btn btn-outline-warning">
            <i class="bi bi-journal-x me-2"></i>Wrong Answer Notebook
        </a>
    </div>

    <div th:replace="fragments/footer :: footer-content"></div>

    <style>
        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            border: 6px solid;
        }
        .score-pass { border-color: #06d6a0; background: rgba(6,214,160,0.08); }
        .score-fail { border-color: #ef476f; background: rgba(239,71,111,0.08); }
        .score-value { font-size: 2.5rem; font-weight: 800; }
        .score-pass .score-value { color: #06d6a0; }
        .score-fail .score-value { color: #ef476f; }
        .score-divider { font-size: 1.5rem; color: var(--text-secondary); }
        .score-total { font-size: 1.5rem; color: var(--text-secondary); }
        .answer-detail:last-child { border-bottom: none !important; }
    </style>
</body>
</html>
