<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- FOOTER FRAGMENT: Closes main-content, main-layout, adds footer -->
<th:block th:fragment="footer-content">
            </main><!-- /main-content -->
        </div><!-- /main-layout -->

        <!-- Footer -->
        <footer class="app-footer">
            <div class="container-fluid">
                <span>&copy; 2026 Online Exam System | Topic 5: Intelligent Test Assembly</span>
                <span class="ms-auto text-muted">Final Semester Project</span>
            </div>
        </footer>
    </div><!-- /app-wrapper -->

    <!-- Reusable Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalTitle">Confirm Action</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="confirmModalMessage">
                    Are you sure?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="confirmModalCancel" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmModalBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Session Timeout Warning Modal -->
    <div class="modal fade" id="sessionWarningModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header bg-warning-subtle">
                    <h5 class="modal-title"><i class="bi bi-clock-history me-2"></i>Session Expiring</h5>
                </div>
                <div class="modal-body text-center py-4">
                    <i class="bi bi-hourglass-split display-3 text-warning mb-3 d-block"></i>
                    <p class="mb-0">Your session will expire soon due to inactivity. Click below to stay signed in.</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal"
                            onclick="window.resetSessionTimer()">
                        <i class="bi bi-shield-check me-2"></i>Stay Signed In
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/settings.js}"></script>
    <script th:src="@{/js/app.js}"></script>

</th:block>

</html>
