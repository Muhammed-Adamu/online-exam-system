<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="auto">
<head th:replace="fragments/header :: head"></head>
<body>
    <div th:replace="fragments/header :: header-content"></div>
    <div th:replace="fragments/sidebar :: sidebar-content"></div>

    <div class="row g-4 mb-3">
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon bg-success-subtle text-success"><i class="bi bi-file-earmark-check"></i></div>
                <div class="stat-info"><h3 th:text="${todayStats.todaySubmissions}">0</h3><p>Today's Submissions</p></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon bg-primary-subtle text-primary"><i class="bi bi-person-plus"></i></div>
                <div class="stat-info"><h3 th:text="${todayStats.todayNewUsers}">0</h3><p>New Users Today</p></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="stat-card">
                <div class="stat-icon bg-info-subtle text-info"><i class="bi bi-activity"></i></div>
                <div class="stat-info"><h3 th:text="${#lists.size(activity)}">0</h3><p>Total Events</p></div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0"><i class="bi bi-clock-history me-2"></i>System Activity Log</h5>
            <button class="btn btn-sm btn-outline-primary" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise me-1"></i>Refresh
            </button>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(activity)}" class="text-center py-5 text-muted">
                <i class="bi bi-inbox display-3 d-block mb-2 opacity-25"></i>
                No activity recorded yet.
            </div>
            <table class="table table-hover mb-0" th:if="${!#lists.isEmpty(activity)}">
                <thead>
                    <tr><th>Type</th><th>Actor</th><th>Role</th><th>Detail</th><th>Time</th></tr>
                </thead>
                <tbody>
                    <tr th:each="act : ${activity}">
                        <td>
                            <span class="badge" th:classappend="${act.activity_type == 'REGISTRATION'} ? 'bg-primary' : 'bg-success'"
                                  th:text="${act.activity_type == 'REGISTRATION'} ? 'Registration' : 'Submission'">Type</span>
                        </td>
                        <td><strong th:text="${act.actor_name}">Name</strong></td>
                        <td><span class="badge" th:classappend="|role-badge-${#strings.toLowerCase(act.actor_role)}|"
                                  th:text="${act.actor_role}">Role</span></td>
                        <td th:text="${act.detail}">detail</td>
                        <td><small th:text="${#temporals.format(act.activity_time, 'yyyy-MM-dd HH:mm:ss')}">time</small></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer-content"></div>
</body>
</html>
