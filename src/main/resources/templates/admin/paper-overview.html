<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="auto">
<head th:replace="fragments/header :: head"></head>
<body>
    <div th:replace="fragments/header :: header-content"></div>
    <div th:replace="fragments/sidebar :: sidebar-content"></div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0"><i class="bi bi-file-earmark-text me-2"></i>All Exam Papers</h5>
            <span class="text-muted small" th:text="${#lists.size(papers)} + ' papers total'">0 papers</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Creator</th>
                            <th>Status</th>
                            <th>Type</th>
                            <th>Questions</th>
                            <th>Score</th>
                            <th>Duration</th>
                            <th>Attempts</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="paper : ${papers}">
                            <td th:text="${paper.id}">1</td>
                            <td>
                                <strong th:text="${paper.title}">Title</strong>
                                <br><small class="text-muted" th:text="${paper.description} ?: ''">desc</small>
                            </td>
                            <td th:text="${paper.creatorName}">Creator</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${paper.status == 'PUBLISHED'} ? 'bg-success' : (${paper.status == 'DRAFT'} ? 'bg-warning' : 'bg-secondary')"
                                      th:text="${paper.status}">Status</span>
                            </td>
                            <td th:text="${paper.assemblyType} ?: 'MANUAL'">Type</td>
                            <td th:text="${paper.questionCount}">0</td>
                            <td th:text="${paper.totalScore}">0</td>
                            <td th:text="${paper.durationMinutes} + ' min'">0 min</td>
                            <td th:text="${paper.attemptCount}">0</td>
                            <td><small th:text="${#temporals.format(paper.createdAt, 'yyyy-MM-dd HH:mm')}">date</small></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(papers)}">
                            <td colspan="10" class="text-center py-5 text-muted">
                                <i class="bi bi-file-earmark display-5 d-block mb-2 opacity-25"></i>
                                No exam papers have been created yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer-content"></div>
</body>
</html>
