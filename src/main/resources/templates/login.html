s<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/themes.css}" rel="stylesheet">
    <script>
        (function() {
            const saved = localStorage.getItem('exam-theme');
            if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            else if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
            else document.documentElement.setAttribute('data-theme', 'auto');
        })();
    </script>
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }
        .login-bg-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            z-index: 0;
        }
        .login-bg-shape.shape-1 {
            width: 600px; height: 600px;
            background: var(--accent-color);
            top: -200px; right: -150px;
        }
        .login-bg-shape.shape-2 {
            width: 400px; height: 400px;
            background: var(--accent-color);
            bottom: -100px; left: -100px;
        }
        .login-card {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            border: 1px solid var(--border-color);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo i {
            font-size: 3rem;
            color: var(--accent-color);
        }
        .login-logo h3 {
            margin-top: 0.5rem;
            color: var(--text-primary);
            font-weight: 700;
        }
        .input-group-text {
            background: var(--bg-input);
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        .form-control {
            background: var(--bg-input);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        .form-control:focus {
            background: var(--bg-input);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.15);
            color: var(--text-primary);
        }
        .btn-login {
            padding: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        .theme-toggle-login {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-bg-shape shape-1"></div>
        <div class="login-bg-shape shape-2"></div>

        <!-- Theme toggle on login page -->
        <div class="theme-toggle-login">
            <div class="btn-group btn-group-sm" role="group">
                <button class="btn btn-outline-secondary" onclick="setTheme('light')" title="Light">
                    <i class="bi bi-sun-fill"></i>
                </button>
                <button class="btn btn-outline-secondary" onclick="setTheme('dark')" title="Dark">
                    <i class="bi bi-moon-fill"></i>
                </button>
                <button class="btn btn-outline-secondary" onclick="setTheme('auto')" title="System">
                    <i class="bi bi-circle-half"></i>
                </button>
            </div>
        </div>

        <div class="login-card">
            <div class="login-logo">
                <i class="bi bi-mortarboard-fill"></i>
                <h3>Online Exam System</h3>
                <p class="text-muted">Sign in to your account</p>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i>
                <span th:text="${error}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Success Message -->
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${message}">Message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/doLogin}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control"
                               placeholder="Enter username" required autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control"
                               placeholder="Enter password" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <div class="mt-4 text-center">
                <small class="text-muted">
                    <strong>Demo Accounts:</strong><br>
                    Admin: admin / 123456<br>
                    Teacher: teacher1 / 123456<br>
                    Student: student1 / 123456
                </small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
