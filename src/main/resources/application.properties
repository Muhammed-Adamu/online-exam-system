# ============================================
# Online Exam System - Application Configuration
# ============================================

# Server
server.port=8080
server.servlet.context-path=/exam

# MySQL DataSource
# Credentials are read from environment variables so no secrets are stored in git.
#   Local dev : set DB_PASSWORD as a user environment variable (see README.md)
#   Deployment: set DB_URL / DB_USERNAME / DB_PASSWORD in your host's dashboard
# DB_PASSWORD has NO default - the app fails fast if it is missing, rather than
# silently trying a blank password.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_exam_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.exam.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.servlet.content-type=text/html

# Date/Time Format
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# File Upload (if needed for profile pictures)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.exam=DEBUG
logging.level.org.springframework.web=INFO

# Log to file for error tracking
logging.file.path=logs
logging.file.name=logs/online-exam-system.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] [%X{errorCode}] - %msg%n
logging.pattern.console=%d{HH:mm:ss.SSS} %highlight(%-5level) %cyan(%-40logger{36}) - %msg%n

# Rolling policy
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=100MB
